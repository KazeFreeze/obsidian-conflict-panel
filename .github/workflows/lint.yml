name: Node.js build

on:
    push:
        branches: ['**']
    pull_request:
        branches: ['**']

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v6
            # ONE Node version, matching release.yml, so CI tests exactly what cuts
            # a release. The product here is a single bundled main.js running inside
            # Obsidian's own Electron runtime, so a Node matrix tests the build
            # toolchain rather than the plugin, and it was costing real signal: the
            # npm shipped with Node 20 and 22 aborts on esbuild's openharmony-arm64
            # optional dependency instead of skipping it (EBADPLATFORM), so the whole
            # matrix was red for a platform nobody here builds for.
            - name: Use Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: 24
                  cache: 'npm'
            - run: npm ci
            - run: npm run build --if-present
            - run: npm test
            - run: npm run lint
