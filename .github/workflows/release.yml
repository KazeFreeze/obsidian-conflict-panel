name: Release Obsidian plugin

on:
    push:
        tags:
            - '*'

jobs:
    build:
        runs-on: ubuntu-latest
        permissions:
            contents: write
            id-token: write
            attestations: write
        steps:
            - uses: actions/checkout@v6

            - name: Use Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: 24
                  cache: 'npm'

            - name: Build and test plugin
              run: |
                  npm ci
                  npm test
                  npm run build

            - name: Check for optional styles
              id: styles
              run: |
                  [ -f styles.css ] && echo "exists=true" >> "$GITHUB_OUTPUT" || echo "exists=false" >> "$GITHUB_OUTPUT"

            - name: Attest build provenance
              uses: actions/attest@v4
              with:
                  subject-path: |
                      main.js
                      ${{ steps.styles.outputs.exists == 'true' && 'styles.css' || '' }}

            - name: Create release
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  tag="${GITHUB_REF#refs/tags/}"

                  # NOT a draft. BRAT installs from the latest PUBLISHED release and
                  # cannot see a draft at all, so a drafted release ships to nobody.
                  #
                  # versions.json is attached too: it maps each plugin version to the
                  # minimum Obsidian it needs, and is how a device on an older build
                  # is offered the last compatible version instead of a broken one.
                  gh release create "$tag" \
                    --title="$tag" \
                    --generate-notes \
                    main.js manifest.json versions.json ${{ steps.styles.outputs.exists == 'true' && 'styles.css' || '' }}
